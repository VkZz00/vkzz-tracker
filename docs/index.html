<style>

  /* ── Tips view ── */

      <!-- Search row -->

      <div id="playerFilters" style="display:none;margin-bottom:20px">
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
          <span style="font-size:.8rem;color:var(--muted);align-self:center;margin-right:4px">Surface</span>
          <button class="pf-btn active" data-surface="all"  onclick="setPlayerFilter('surface','all')">All</button>
          <button class="pf-btn"        data-surface="Hard" onclick="setPlayerFilter('surface','Hard')">Hard</button>
          <button class="pf-btn"        data-surface="Clay" onclick="setPlayerFilter('surface','Clay')">Clay</button>
          <button class="pf-btn"        data-surface="Grass" onclick="setPlayerFilter('surface','Grass')">Grass</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center">
          <span style="font-size:.8rem;color:var(--muted);margin-right:4px">Period</span>
          <button class="pf-btn active" data-period="all"  onclick="setPlayerFilter('period','all')">All time</button>
          <button class="pf-btn"        data-period="2026" onclick="setPlayerFilter('period','2026')">2026</button>
          <button class="pf-btn"        data-period="2025" onclick="setPlayerFilter('period','2025')">2025</button>
          <button class="pf-btn"        data-period="2024" onclick="setPlayerFilter('period','2024')">2024</button>
          <button class="pf-btn"        data-period="6mo"  onclick="setPlayerFilter('period','6mo')">Last 6mo</button>
          <button class="pf-btn"        data-period="90d"  onclick="setPlayerFilter('period','90d')">Last 90d</button>
          <button class="pf-btn"        data-period="30d"  onclick="setPlayerFilter('period','30d')">Last 30d</button>
          <span style="font-size:.8rem;color:var(--muted);margin-left:4px">Custom</span>
          <input type="text" id="pDateFrom" placeholder="YYYY-MM-DD" maxlength="10" oninput="setCustomDateRange()"
            style="padding:4px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:.78rem;width:100px;text-align:center">
          <span style="font-size:.8rem;color:var(--muted)">–</span>
          <input type="text" id="pDateTo" placeholder="YYYY-MM-DD" maxlength="10" oninput="setCustomDateRange()"
            style="padding:4px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:.78rem;width:100px;text-align:center">
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
          <span style="font-size:.8rem;color:var(--muted);align-self:center;margin-right:4px">Level</span>
          <button class="pf-btn active" data-level="all"        onclick="setPlayerFilter('level','all')">All</button>
          <button class="pf-btn"        data-level="atp"        onclick="setPlayerFilter('level','atp')">ATP</button>
          <button class="pf-btn"        data-level="challenger" onclick="setPlayerFilter('level','challenger')">Challenger</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <span style="font-size:.8rem;color:var(--muted);align-self:center;margin-right:4px">Vs rank</span>
          <button class="pf-btn active" data-rank="all"  onclick="setPlayerFilter('rank','all')">All</button>
          <button class="pf-btn"        data-rank="10"   onclick="setPlayerFilter('rank','10')">Top 10</button>
          <button class="pf-btn"        data-rank="20"   onclick="setPlayerFilter('rank','20')">Top 20</button>
          <button class="pf-btn"        data-rank="50"   onclick="setPlayerFilter('rank','50')">Top 50</button>
          <button class="pf-btn"        data-rank="100"  onclick="setPlayerFilter('rank','100')">Top 100</button>
        </div>
      </div>

      <div id="playerContent"></div>
    </div>
  </div>

  <!-- Admin -->
  <div class="view" id="view-admin">
    <div style="max-width:900px">
      <div style="font-size:1.3rem;font-weight:700;letter-spacing:-.02em;margin-bottom:20px">Users</div>
      <div id="adminContent"><div style="color:var(--muted)">Loading...</div></div>
    </div>
  </div>

  <!-- Login / Register -->
  <div class="view" id="view-login">
    <div class="login-box">
      <h2>Welcome to VkZz</h2>
      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchAuthTab('login')">Log in</div>
        <div class="auth-tab" onclick="switchAuthTab('register')">Create account</div>
      </div>

      <!-- Login form -->
      <form class="auth-form" id="form-login" onsubmit="doLogin(event)">
        <div>
          <label>Email</label>
          <input type="email" id="login-email" required autocomplete="email">
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
          <div style="text-align:right;margin-top:6px">
            <span onclick="doResetPassword()" style="font-size:.78rem;color:var(--muted);cursor:pointer;text-decoration:underline">Forgot password?</span>
          </div>
        </div>
        <div class="global-err" id="login-err"></div>
        <div id="reset-ok" style="font-size:.82rem;color:var(--green);display:none">Password reset email sent — check your inbox.</div>
        <button type="submit" class="auth-btn-submit" id="login-submit">Log in</button>
      </form>

      <!-- Register form -->
      <form class="auth-form hidden" id="form-register" onsubmit="doRegister(event)">
        <div>
          <label>Username</label>
          <input type="text" id="reg-name" required autocomplete="name">
        </div>
        <div>
          <label>Email</label>
          <input type="email" id="reg-email" required autocomplete="email">
        </div>
        <div>
          <label>Phone (optional)</label>
          <input type="tel" id="reg-phone" autocomplete="tel">
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="reg-password" required autocomplete="new-password">
          <div class="auth-hint">At least 6 characters</div>
        </div>
        <div>
          <label>Confirm password</label>
          <input type="password" id="reg-password2" required autocomplete="new-password">
          <div class="auth-err" id="reg-pw-err">Passwords do not match.</div>
        </div>
        <div class="check-row">
          <input type="checkbox" id="reg-newsletter">
          <span onclick="document.getElementById('reg-newsletter').click()">I want to receive tips and updates by email</span>
        </div>
        <div class="global-err" id="reg-err"></div>
        <button type="submit" class="auth-btn-submit" id="reg-submit">Create account</button>
      </form>
    </div>
  </div>

</main>

<script>
// ── Sidebar toggle ────────────────────────────────────────────────────────────
const isMobile = () => window.innerWidth <= 600;

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const mobileBtn = document.querySelector('.mobile-toggle');
  if (isMobile()) {
    sidebar.classList.toggle('open');
    const isOpen = sidebar.classList.contains('open');
    overlay.classList.toggle('show', isOpen);
    if (mobileBtn) mobileBtn.style.display = isOpen ? 'none' : 'flex';
  } else {
    sidebar.classList.toggle('collapsed');
  }
}

// ── Auth ─────────────────────────────────────────────────────────────────────
let currentUser = null;

auth.onAuthStateChanged(async user => {
  currentUser = user;
  if (user) {
    document.getElementById('userLabel').textContent = user.displayName || user.email;
    document.getElementById('userLabel').style.display = 'block';
    document.getElementById('logoutBtn').style.display = 'block';
    document.getElementById('loginBtn').style.display  = 'none';
    document.getElementById('adminNav').style.display  = user.uid === ADMIN_UID ? 'flex' : 'none';
  } else {
    document.getElementById('userLabel').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('loginBtn').style.display  = 'block';
    document.getElementById('adminNav').style.display  = 'none';
  }
});

// ── Navigation ────────────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  const navEl = document.querySelector(`[data-view="${name}"]`);
  if (navEl) navEl.classList.add('active');
  if (name === 'players') { document.getElementById('playerSearch').disabled = false; document.getElementById('playerSearch').placeholder = 'Search player...'; ensurePlayerIndex(); }
  if (name === 'admin') loadAdminUsers();
  // Close sidebar on mobile after navigation
  if (isMobile()) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
    const mobileBtn = document.querySelector('.mobile-toggle');
    if (mobileBtn) mobileBtn.style.display = 'flex';
  }
}

// ── Login / Register view ──────────────────────────────────────────────────────
function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
  });
  document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
  document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
}

async function doResetPassword() {
  const email = document.getElementById('login-email').value.trim();
  const errEl = document.getElementById('login-err');
  const okEl  = document.getElementById('reset-ok');
  errEl.classList.remove('show'); okEl.style.display = 'none';
  if (!email) { errEl.textContent = 'Enter your email address first.'; errEl.classList.add('show'); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    okEl.style.display = 'block';
  } catch(err) {
    errEl.textContent = authErrMsg(err.code);
    errEl.classList.add('show');
  }
}

async function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  const btn   = document.getElementById('login-submit');
  errEl.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    await auth.signInWithEmailAndPassword(email, pw);
    showView('players');
  } catch(err) {
    errEl.textContent = authErrMsg(err.code);
    errEl.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Log in';
  }
}

async function doRegister(e) {
  e.preventDefault();
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const pw    = document.getElementById('reg-password').value;
  const pw2   = document.getElementById('reg-password2').value;
  const newsletter = document.getElementById('reg-newsletter').checked;
  const errEl = document.getElementById('reg-err');
  const pwErr = document.getElementById('reg-pw-err');
  errEl.classList.remove('show'); pwErr.classList.remove('show');
  if (pw !== pw2) { pwErr.classList.add('show'); return; }
  const btn = document.getElementById('reg-submit');
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await cred.user.updateProfile({ displayName: name });
    showView('players');
  } catch(err) {
    errEl.textContent = authErrMsg(err.code);
    errEl.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Create account';
  }
}

function authErrMsg(code) {
  const map = {
    'auth/invalid-email':          'Invalid email address.',
    'auth/user-not-found':         'No account found with this email.',
    'auth/wrong-password':         'Incorrect password.',
    'auth/invalid-credential':     'Incorrect email or password.',
    'auth/email-already-in-use':   'An account with this email already exists.',
    'auth/weak-password':          'Password must be at least 6 characters.',
    'auth/too-many-requests':      'Too many attempts. Please try again later.',
    'auth/network-request-failed': 'Network error. Check your connection.',
  };
  return map[code] || 'Something went wrong. Please try again.';
}

// ── Players ───────────────────────────────────────────────────────────────────
let playerIndex = null, currentPlayer = null, currentPlayerB = null;
let pSurface = 'all', pPeriod = 'all', pLevel = 'all', pRank = 'all', compareMode = false;
let pCustomFrom = null, pCustomTo = null;

async function ensurePlayerIndex() {
  if (playerIndex) return;
  const r = await fetch('player_index.json');
  playerIndex = await r.json();
}

function onPlayerSearch(slot) {
  const inputId = slot === 'B' ? 'playerSearchB' : 'playerSearch';
  const ddId    = slot === 'B' ? 'playerDropdownB' : 'playerDropdown';
  const q = document.getElementById(inputId).value.trim().toLowerCase();
  const dd = document.getElementById(ddId);
  if (!q) { dd.style.display = 'none'; return; }
  ensurePlayerIndex().then(() => {
    const matches = playerIndex.filter(p => p.name.toLowerCase().includes(q)).slice(0, 10);
    if (!matches.length) { dd.style.display = 'none'; return; }
    dd.innerHTML = matches.map(p => `
      <div onclick="selectPlayer('${p.id}','${p.name.replace(/'/g,"\\'")}','${slot}')"
        style="padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border)"
        onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background=''">
        <span style="font-weight:600">${p.name}</span>
      </div>`).join('');
    dd.style.display = 'block';
  });
}

async function selectPlayer(id, name, slot) {
  const inputId = slot === 'B' ? 'playerSearchB' : 'playerSearch';
  const ddId    = slot === 'B' ? 'playerDropdownB' : 'playerDropdown';
  document.getElementById(inputId).value = name;
  document.getElementById(ddId).style.display = 'none';
  document.getElementById('playerContent').innerHTML = '<div style="color:var(--muted);padding:20px 0">Loading...</div>';
  document.getElementById('playerFilters').style.display = 'block';
  const r = await fetch(`players/${id}.json`);
  const data = await r.json();
  if (slot === 'B') { currentPlayerB = data; }
  else { currentPlayer = data; document.getElementById('compareToggleBtn').style.display = 'block'; }
  renderPlayer();
}

function toggleCompare() {
  compareMode = !compareMode;
  const wrap = document.getElementById('compareSearchWrap');
  const btn  = document.getElementById('compareToggleBtn');
  if (compareMode) {
    wrap.style.display = 'block'; btn.textContent = '✕ Compare';
    btn.style.color = 'var(--accent)';
  } else {
    wrap.style.display = 'none'; btn.textContent = '+ Compare';
    btn.style.color = ''; currentPlayerB = null;
    document.getElementById('playerSearchB').value = '';
  }
  renderPlayer();
}

function setPlayerFilter(type, val) {
  if (type === 'surface') {
    pSurface = val;
    document.querySelectorAll('[data-surface]').forEach(b => b.classList.toggle('active', b.dataset.surface === val));
  } else if (type === 'period') {
    pPeriod = val;
    pCustomFrom = pCustomTo = null;
    document.getElementById('pDateFrom').value = '';
    document.getElementById('pDateTo').value = '';
    document.getElementById('pDateFrom').style.borderColor = '';
    document.getElementById('pDateTo').style.borderColor = '';
    document.querySelectorAll('[data-period]').forEach(b => b.classList.toggle('active', b.dataset.period === val));
  } else if (type === 'level') {
    pLevel = val;
    document.querySelectorAll('[data-level]').forEach(b => b.classList.toggle('active', b.dataset.level === val));
  } else {
    pRank = val;
    document.querySelectorAll('[data-rank]').forEach(b => b.classList.toggle('active', b.dataset.rank === val));
  }
  if (currentPlayer) renderPlayer();
}

function setCustomDateRange() {
  const dateRe = /^\d{4}-\d{2}-\d{2}$/;
  const fromRaw = document.getElementById('pDateFrom').value.trim();
  const toRaw   = document.getElementById('pDateTo').value.trim();
  pCustomFrom = (fromRaw && dateRe.test(fromRaw)) ? fromRaw : null;
  pCustomTo   = (toRaw   && dateRe.test(toRaw))   ? toRaw   : null;
  document.getElementById('pDateFrom').style.borderColor = (fromRaw && !pCustomFrom) ? '#e05555' : '';
  document.getElementById('pDateTo').style.borderColor   = (toRaw   && !pCustomTo)   ? '#e05555' : '';
  if (pCustomFrom || pCustomTo) {
    pPeriod = 'custom';
    document.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
  }
  if (currentPlayer) renderPlayer();
}

function isChallenger(tournament) {
  const t = (tournament || '').toLowerCase();
  return t.includes('challenger') || t.endsWith(' ch');
}

function filterMatches(matches) {
  const now = new Date();
  return matches.filter(m => {
    if (pSurface !== 'all' && m.surface !== pSurface) return false;
    if (pLevel === 'challenger' && !isChallenger(m.tournament)) return false;
    if (pLevel === 'atp' && isChallenger(m.tournament)) return false;
    if (pRank !== 'all' && (typeof m.opp_rank !== 'number' || m.opp_rank > parseInt(pRank))) return false;
    const y = m.date.slice(0, 4), mo = m.date.slice(4, 6), d = m.date.slice(6, 8);
    const date = new Date(`${y}-${mo}-${d}`);
    if (pPeriod === 'custom') {
      if (pCustomFrom && m.date.slice(0,4)+'-'+m.date.slice(4,6)+'-'+m.date.slice(6,8) < pCustomFrom) return false;
      if (pCustomTo   && m.date.slice(0,4)+'-'+m.date.slice(4,6)+'-'+m.date.slice(6,8) > pCustomTo)   return false;
    } else if (pPeriod === '2024' || pPeriod === '2025' || pPeriod === '2026') {
      if (y !== pPeriod) return false;
    } else if (pPeriod === '30d') {
      if ((now - date) / 86400000 > 30) return false;
    } else if (pPeriod === '90d') {
      if ((now - date) / 86400000 > 90) return false;
    } else if (pPeriod === '6mo') {
      if ((now - date) / 86400000 > 183) return false;
    }
    return true;
  });
}

function pct(a, b) { return b > 0 ? (a / b * 100).toFixed(1) + '%' : '—'; }
function pctNum(a, b) { return b > 0 ? a / b * 100 : null; }
function fmt(v, dec = 1) { return v != null ? v.toFixed(dec) : '—'; }

function tip(text) {
  return `<span class="tip-wrap"><span class="tip-icon">ⓘ</span><span class="tip-box">${text.replace(/<br>/g,'\n')}</span></span>`;
}

function calcStats(p) {
  const matches = filterMatches(p.matches);
  const wins = matches.filter(m => m.result === 'W').length;
  const losses = matches.filter(m => m.result === 'L').length;
  const total = wins + losses;
  let sp=0, fi=0, fw=0, sw=0, aces=0, bf=0, bs=0, osp=0, ofi=0, ofw=0, osw=0, obf=0, obs=0;
  matches.forEach(m => {
    sp+=m.sp||0; fi+=m.fi||0; fw+=m.fw||0; sw+=m.sw||0;
    aces+=m.aces||0; bf+=m.bf||0; bs+=m.bs||0;
    osp+=m.osp||0; ofi+=m.ofi||0; ofw+=m.ofw||0; osw+=m.osw||0;
    obf+=m.obf||0; obs+=m.obs||0;
  });
  const rpwNum = pctNum(osp - ofw - osw, osp);
  const splNum = pctNum(sp - fw - sw, sp);
  const drNum  = (rpwNum != null && splNum != null && splNum > 0) ? rpwNum / splNum : null;
  const tpwNum = pctNum(fw + sw + (osp - ofw - osw), sp + osp);
  const bpconvNum = pctNum(obf - obs, obf);
  const ranks = matches.map(m => m.opp_rank).filter(r => typeof r === 'number' && r > 0);
  const avgOppRank = ranks.length ? Math.round(ranks.reduce((a, b) => a + b, 0) / ranks.length) : null;
  return { matches, wins, losses, total, sp, fi, fw, sw, aces, bf, bs, osp, ofi, ofw, osw, obf, obs,
           rpwNum, splNum, drNum, tpwNum, bpconvNum, avgOppRank };
}

function playerInfoLine(p) {
  return [
    p.hand === 'R' ? 'Right-handed' : p.hand === 'L' ? 'Left-handed' : '',
    p.backhand === '2' ? 'Two-handed BH' : p.backhand === '1' ? 'One-handed BH' : '',
    p.height ? p.height + 'cm' : '',
    p.age ? 'Age ' + p.age : '',
  ].filter(Boolean).join(' · ');
}

function matchList(matches) {
  return [...matches].reverse().slice(0, 20).map(m => {
    const dateStr = m.date.slice(0,4)+'-'+m.date.slice(4,6)+'-'+m.date.slice(6,8);
    const srfColor = m.surface === 'Hard' ? '#4a9eff' : m.surface === 'Clay' ? '#e07b54' : '#5cb85c';
    return `<div class="match-row">
      <div style="color:var(--muted)">${dateStr}</div>
      <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.tournament} <span style="color:var(--muted);font-size:.75rem">${m.round}</span></div>
      <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.opponent}</div>
      <div style="color:${srfColor};font-size:.75rem;font-weight:600">${m.surface.slice(0,2).toUpperCase()}</div>
      <div style="font-weight:700;color:${m.result==='W'?'var(--green)':'#e05555'}">${m.result} <span style="color:var(--muted);font-weight:400;font-size:.75rem">${m.score||''}</span></div>
    </div>`;
  }).join('');
}

function renderPlayer() {
  const el = document.getElementById('playerContent');
  if (!currentPlayer) return;

  if (compareMode && currentPlayerB) {
    renderCompare(el);
  } else {
    renderSingle(el, currentPlayer);
  }
}

function renderSingle(el, p) {
  const s = calcStats(p);
  if (!s.total) { el.innerHTML = '<div style="color:var(--muted);padding:20px 0">No matches for this filter.</div>'; return; }
  el.innerHTML = `
    <div style="margin-bottom:20px">
      <div style="font-size:1.4rem;font-weight:700">${p.name}</div>
      <div style="color:var(--muted);font-size:.83rem;margin-top:2px">${playerInfoLine(p)}</div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="sb-label">W / L ${tip('Wins / Losses in filtered matches')}</div><div class="sb-val">${s.wins} / ${s.losses}</div></div>
      <div class="stat-box"><div class="sb-label">Win % ${tip('Match win percentage')}</div><div class="sb-val">${pct(s.wins, s.total)}</div></div>
      <div class="stat-box"><div class="sb-label">TPW% ${tip('Total Points Won %:\nall points won divided by\ntotal points played')}</div><div class="sb-val">${s.tpwNum != null ? s.tpwNum.toFixed(1)+'%' : '—'}</div></div>
      <div class="stat-box"><div class="sb-label">RPW% ${tip('Return Points Won %:\nreturn points won divided by\nopponent\'s total serve points')}</div><div class="sb-val">${s.rpwNum != null ? s.rpwNum.toFixed(1)+'%' : '—'}</div></div>
      <div class="stat-box"><div class="sb-label">DR ${tip('Dominance Ratio:\n% of return points won divided by\n% of serve points lost.\n>1.0 = dominant, <1.0 = struggling')}</div><div class="sb-val">${s.drNum != null ? s.drNum.toFixed(2) : '—'}</div></div>
      <div class="stat-box"><div class="sb-label">BP conv% ${tip('Break Point Conversion %:\nbreak points won divided by\nbreak points created')}</div><div class="sb-val">${s.bpconvNum != null ? s.bpconvNum.toFixed(1)+'%' : '—'}</div></div>
      <div class="stat-box"><div class="sb-label">BP saved % ${tip('Break Points Saved %:\nbreak points saved divided by\nbreak points faced on own serve')}</div><div class="sb-val">${pct(s.bs, s.bf)}</div></div>
      <div class="stat-box"><div class="sb-label">1st serve % ${tip('First Serve %:\nfirst serves in divided by\ntotal serve points')}</div><div class="sb-val">${pct(s.fi, s.sp)}</div></div>
      <div class="stat-box"><div class="sb-label">1st serve W% ${tip('First Serve Won %:\npoints won when first serve\nlands in')}</div><div class="sb-val">${pct(s.fw, s.fi)}</div></div>
      <div class="stat-box"><div class="sb-label">2nd serve W% ${tip('Second Serve Won %:\npoints won on second serve')}</div><div class="sb-val">${pct(s.sw, s.sp - s.fi)}</div></div>
      <div class="stat-box"><div class="sb-label">Aces / match ${tip('Average aces per match')}</div><div class="sb-val">${fmt(s.aces / s.total)}</div></div>
      <div class="stat-box"><div class="sb-label">Return 1st W% ${tip('Return Points Won % on 1st serve:\npoints won when opponent\'s\nfirst serve lands in')}</div><div class="sb-val">${pct(s.ofi - s.ofw, s.ofi)}</div></div>
      <div class="stat-box"><div class="sb-label">Return 2nd W% ${tip('Return Points Won % on 2nd serve:\npoints won on opponent\'s\nsecond serve')}</div><div class="sb-val">${pct(s.osp - s.ofi - s.osw, s.osp - s.ofi)}</div></div>
      <div class="stat-box"><div class="sb-label">Matches ${tip('Total matches with charting data\nin filtered selection')}</div><div class="sb-val">${s.total}</div></div>
      <div class="stat-box"><div class="sb-label">Avg Opp Rank ${tip('Average opponent world ranking\nacross filtered matches')}</div><div class="sb-val">${s.avgOppRank != null ? '#'+s.avgOppRank : '—'}</div></div>
    </div>
    <div style="font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Recent matches</div>
    <div style="max-width:800px">
      <div class="match-row head"><div>Date</div><div>Tournament</div><div>Opponent</div><div>Srf</div><div>Result</div></div>
      ${matchList(s.matches)}
    </div>`;
}

function renderCompare(el) {
  const A = calcStats(currentPlayer);
  const B = calcStats(currentPlayerB);

  const rows = [
    { label: `Matches ${tip('Total matches with\ncharting data')}`,   a: A.total,        b: B.total,        fmt: v => v,                   higher: true,  raw: true },
    { label: `W / L ${tip('Wins / Losses')}`,        a: `${A.wins}/${A.losses}`, b: `${B.wins}/${B.losses}`, fmt: v => v, higher: null },
    { label: `Win % ${tip('Match win percentage')}`,  a: pctNum(A.wins, A.total), b: pctNum(B.wins, B.total), fmt: v => v?.toFixed(1)+'%', higher: true },
    { label: `TPW% ${tip('Total Points Won %')}`,     a: A.tpwNum,   b: B.tpwNum,   fmt: v => v?.toFixed(1)+'%', higher: true },
    { label: `RPW% ${tip('Return Points Won %')}`,    a: A.rpwNum,   b: B.rpwNum,   fmt: v => v?.toFixed(1)+'%', higher: true },
    { label: `DR ${tip('Dominance Ratio:\nRPW% / Serve points lost%')}`, a: A.drNum, b: B.drNum, fmt: v => v?.toFixed(2), higher: true },
    { label: `BP conv% ${tip('Break Point Conversion %')}`, a: A.bpconvNum, b: B.bpconvNum, fmt: v => v?.toFixed(1)+'%', higher: true },
    { label: `BP saved % ${tip('Break Points Saved %')}`, a: pctNum(A.bs, A.bf), b: pctNum(B.bs, B.bf), fmt: v => v?.toFixed(1)+'%', higher: true },
    { label: `1st serve % ${tip('First Serve In %')}`, a: pctNum(A.fi, A.sp), b: pctNum(B.fi, B.sp), fmt: v => v?.toFixed(1)+'%', higher: true },
    { label: `1st serve W% ${tip('Points won on first serve')}`, a: pctNum(A.fw, A.fi), b: pctNum(B.fw, B.fi), fmt: v => v?.toFixed(1)+'%', higher: true },
    { label: `2nd serve W% ${tip('Points won on second serve')}`, a: pctNum(A.sw, A.sp-A.fi), b: pctNum(B.sw, B.sp-B.fi), fmt: v => v?.toFixed(1)+'%', higher: true },
    { label: `Aces / match ${tip('Average aces per match')}`, a: A.total ? A.aces/A.total : null, b: B.total ? B.aces/B.total : null, fmt: v => v?.toFixed(1), higher: true },
    { label: `Avg Opp Rank ${tip('Average opponent world ranking')}`, a: A.avgOppRank, b: B.avgOppRank, fmt: v => v ? '#'+v : '—', higher: false, raw: true },
    { label: `Return 1st W% ${tip('Return % on opponent\'s first serve')}`, a: pctNum(A.ofi-A.ofw, A.ofi), b: pctNum(B.ofi-B.ofw, B.ofi), fmt: v => v?.toFixed(1)+'%', higher: true },
    { label: `Return 2nd W% ${tip('Return % on opponent\'s second serve')}`, a: pctNum(A.osp-A.ofi-A.osw, A.osp-A.ofi), b: pctNum(B.osp-B.ofi-B.osw, B.osp-B.ofi), fmt: v => v?.toFixed(1)+'%', higher: true },
  ];

  const rowsHtml = rows.map(r => {
    const aWins = r.higher !== null && r.a != null && r.b != null && ((r.higher && r.a > r.b) || (!r.higher && r.a < r.b));
    const bWins = r.higher !== null && r.a != null && r.b != null && ((r.higher && r.b > r.a) || (!r.higher && r.b < r.a));
    const aVal = r.a != null ? (r.raw ? r.a : r.fmt(r.a)) : '—';
    const bVal = r.b != null ? (r.raw ? r.b : r.fmt(r.b)) : '—';
    return `<div class="cmp-row">
      <div class="cmp-val ${aWins ? 'cmp-win' : bWins ? 'cmp-lose' : ''}" style="text-align:right;padding-right:12px">${aVal}</div>
      <div class="cmp-label">${r.label}</div>
      <div class="cmp-val ${bWins ? 'cmp-win' : aWins ? 'cmp-lose' : ''}" style="text-align:left;padding-left:12px">${bVal}</div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 160px 1fr;gap:4px;margin-bottom:24px;max-width:700px">
      <div style="text-align:right;padding-right:12px">
        <div style="font-size:1.1rem;font-weight:700">${currentPlayer.name}</div>
        <div style="font-size:.75rem;color:var(--muted);margin-top:2px">${playerInfoLine(currentPlayer)}</div>
      </div>
      <div style="text-align:center;color:var(--muted);font-size:.9rem;align-self:center">vs</div>
      <div style="text-align:left;padding-left:12px">
        <div style="font-size:1.1rem;font-weight:700">${currentPlayerB.name}</div>
        <div style="font-size:.75rem;color:var(--muted);margin-top:2px">${playerInfoLine(currentPlayerB)}</div>
      </div>
    </div>
    <div style="max-width:700px">
      <div class="cmp-row head">
        <div style="text-align:right;padding-right:12px">${currentPlayer.name.split(' ').pop()}</div>
        <div></div>
        <div style="text-align:left;padding-left:12px">${currentPlayerB.name.split(' ').pop()}</div>
      </div>
      ${rowsHtml}
    </div>
    ${(() => {
      const nameB = currentPlayerB.name.toLowerCase();
      const nameA = currentPlayer.name.toLowerCase();
      const h2hA = currentPlayer.matches.filter(m => m.opponent.toLowerCase() === nameB);
      const h2hB = currentPlayerB.matches.filter(m => m.opponent.toLowerCase() === nameA);
      const allH2H = [...h2hA.map(m => ({...m, who:'A'})), ...h2hB.map(m => ({...m, who:'B'}))]
        .sort((a,b) => b.date.localeCompare(a.date));
      const h2hWinsA = h2hA.filter(m => m.result === 'W').length;
      const h2hWinsB = h2hB.filter(m => m.result === 'W').length;
      if (!allH2H.length) return '';
      return `<div style="max-width:700px;margin-top:28px;margin-bottom:28px">
        <div style="font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">
          Head to Head
          <span style="font-weight:700;color:var(--green);margin-left:12px">${currentPlayer.name.split(' ').pop()} ${h2hWinsA}</span>
          <span style="color:var(--muted);margin:0 6px">–</span>
          <span style="font-weight:700;color:var(--accent)">${h2hWinsB} ${currentPlayerB.name.split(' ').pop()}</span>
        </div>
        <div class="match-row head" style="grid-template-columns:90px 1fr 1fr 40px 60px">
          <div>Date</div><div>Winner</div><div>Tournament</div><div>Srf</div><div>Score</div>
        </div>
        ${allH2H.slice(0,20).map(m => {
          const winner = m.result === 'W' ? (m.who==='A' ? currentPlayer.name : currentPlayerB.name)
                                          : (m.who==='A' ? currentPlayerB.name : currentPlayer.name);
          const winnerIsA = winner === currentPlayer.name;
          const srfColor = m.surface==='Hard'?'#4a9eff':m.surface==='Clay'?'#e07b54':'#5cb85c';
          return `<div class="match-row" style="grid-template-columns:90px 1fr 1fr 40px 60px">
            <div style="color:var(--muted);font-size:.75rem">${m.date.slice(0,4)+'-'+m.date.slice(4,6)+'-'+m.date.slice(6,8)}</div>
            <div style="font-weight:700;color:${winnerIsA?'var(--green)':'var(--accent)'}">${winner.split(' ').pop()}</div>
            <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem">${m.tournament}</div>
            <div style="color:${srfColor};font-size:.7rem;font-weight:600">${m.surface.slice(0,2).toUpperCase()}</div>
            <div style="font-size:.75rem;color:var(--muted)">${m.score||''}</div>
          </div>`;
        }).join('')}
      </div>`;
    })()}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px;max-width:900px">
      <div>
        <div style="font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">${currentPlayer.name} — recent</div>
        <div class="match-row head" style="grid-template-columns:80px 1fr 40px 50px"><div>Date</div><div>Opponent</div><div>Srf</div><div>Result</div></div>
        ${[...A.matches].reverse().slice(0,15).map(m => {
          const srfColor = m.surface==='Hard'?'#4a9eff':m.surface==='Clay'?'#e07b54':'#5cb85c';
          return `<div class="match-row" style="grid-template-columns:80px 1fr 40px 50px">
            <div style="color:var(--muted);font-size:.75rem">${m.date.slice(0,4)+'-'+m.date.slice(4,6)+'-'+m.date.slice(6,8)}</div>
            <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem">${m.opponent}</div>
            <div style="color:${srfColor};font-size:.7rem;font-weight:600">${m.surface.slice(0,2).toUpperCase()}</div>
            <div style="font-weight:700;font-size:.8rem;color:${m.result==='W'?'var(--green)':'#e05555'}">${m.result}</div>
          </div>`;
        }).join('')}
      </div>
      <div>
        <div style="font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">${currentPlayerB.name} — recent</div>
        <div class="match-row head" style="grid-template-columns:80px 1fr 40px 50px"><div>Date</div><div>Opponent</div><div>Srf</div><div>Result</div></div>
        ${[...B.matches].reverse().slice(0,15).map(m => {
          const srfColor = m.surface==='Hard'?'#4a9eff':m.surface==='Clay'?'#e07b54':'#5cb85c';
          return `<div class="match-row" style="grid-template-columns:80px 1fr 40px 50px">
            <div style="color:var(--muted);font-size:.75rem">${m.date.slice(0,4)+'-'+m.date.slice(4,6)+'-'+m.date.slice(6,8)}</div>
            <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem">${m.opponent}</div>
            <div style="color:${srfColor};font-size:.7rem;font-weight:600">${m.surface.slice(0,2).toUpperCase()}</div>
            <div style="font-weight:700;font-size:.8rem;color:${m.result==='W'?'var(--green)':'#e05555'}">${m.result}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

// ── Admin ─────────────────────────────────────────────────────────────────────
async function loadAdminUsers() {
  const el = document.getElementById('adminContent');
  if (!currentUser || currentUser.uid !== ADMIN_UID) {
    el.innerHTML = '<div style="color:var(--red)">Access denied.</div>';
    return;
  }
  el.innerHTML = '<div style="color:var(--muted)">Loading...</div>';
  try {
    const listUsers = functions.httpsCallable('listUsers');
    const result = await listUsers({});
    const users = result.data.users || [];
    if (!users.length) { el.innerHTML = '<div style="color:var(--muted)">No users found.</div>'; return; }
    el.innerHTML = `
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:14px">${users.length} registered users</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:.85rem">
          <thead>
            <tr style="color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)">
              <th style="text-align:left;padding:8px 12px 8px 0">Name</th>
              <th style="text-align:left;padding:8px 12px">Email</th>
              <th style="text-align:left;padding:8px 12px">Phone</th>
              <th style="text-align:left;padding:8px 12px">Registered</th>
              <th style="text-align:left;padding:8px 0 8px 12px;color:var(--border)">UID</th>
            </tr>
          </thead>
          <tbody>
            ${users.map(u => `
              <tr style="border-bottom:1px solid var(--border)">
                <td style="padding:10px 12px 10px 0;font-weight:600">${u.displayName || '—'}</td>
                <td style="padding:10px 12px">${u.email || '—'}</td>
                <td style="padding:10px 12px;color:var(--muted)">${u.phoneNumber || '—'}</td>
                <td style="padding:10px 12px;color:var(--muted)">${u.metadata?.creationTime ? new Date(u.metadata.creationTime).toLocaleDateString('fi-FI') : '—'}</td>
                <td style="padding:10px 0 10px 12px;color:var(--border);font-size:.72rem;font-family:monospace">${u.uid}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(err) {
    el.innerHTML = `<div style="color:var(--red)">Error: ${err.message}</div>`;
  }
}

// Close dropdowns on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('#playerSearch') && !e.target.closest('#playerDropdown'))
    document.getElementById('playerDropdown').style.display = 'none';
  if (!e.target.closest('#playerSearchB') && !e.target.closest('#playerDropdownB'))
    document.getElementById('playerDropdownB').style.display = 'none';
});
</script>
